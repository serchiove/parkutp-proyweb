spring.application.name=parkutp
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parkutp}
spring.datasource.username=${DB_USER:parkutp}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# Primera etapa JPA: consultar las tablas existentes sin modificar su esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
joinfaces.faces-servlet.url-mappings=/jsf/*
joinfaces.faces.project-stage=production
server.error.include-message=never
server.tomcat.basedir=${TOMCAT_BASE_DIR:./.tomcat}
