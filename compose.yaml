name: parkutp
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: parkutp
      POSTGRES_USER: parkutp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecuta parkutp/scripts/Configurar-Docker.ps1}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkutp -d parkutp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
  app:
    build: .
    image: parkutp:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      DB_URL: jdbc:postgresql://db:5432/parkutp
      DB_USER: parkutp
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Configura DEMO_PASSWORD}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:4200}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
